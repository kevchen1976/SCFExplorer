<title>One NZ Nokia RAN SCF Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky instrument bar + one working view at a time; dense tables, mono for codes and DNs.
   Palette: cool fibre-room neutrals with an OM4-aqua accent (the colour of the multimode patch cords in these sites). */
:root {
  --bg: #edf1f1;
  --surface: #ffffff;
  --surface-2: #f5f8f8;
  --ink: #102325;
  --ink-2: #3f5558;
  --muted: #687c7f;
  --line: #d3dddd;
  --line-2: #e5ecec;
  --line-strong: #a9b9ba;
  --accent: #0a7c85;
  --accent-ink: #065960;
  --accent-wash: #dcf0f1;
  --on-accent: #ffffff;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #b97a00;
  --warn-wash: #fcf0d4;
  --crit: #d03b3b;
  --crit-wash: #fbe5e5;
  --c-smod: #6250d6;
  --c-bbmod: #2a78d6;
  --c-rmod: #eb6834;
  --c-ald: #1baf7a;
  --c-other: #898781;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --shadow: 0 6px 24px rgba(16, 35, 37, .14);
  --map-sea: #d5e3e7; --map-land: #f7f6f1; --map-border: #b4c1c2; --map-lake: #c4d9e0; --map-label: #4b5e60; --map-halo: #f7f6f1; --map-dark: 0;
  --ping-ok: #1f9a48; --ping-loss: #e5b800; --ping-down: #d63a3a; --ping-wait: #a9b5b7;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1314; --surface: #131e20; --surface-2: #192729; --ink: #e2ebeb; --ink-2: #b2c2c3; --muted: #84989a;
    --line: #283a3c; --line-2: #1f2e30; --line-strong: #46595b; --accent: #38b8c1; --accent-ink: #7dd6dc; --accent-wash: #11343a;
    --on-accent: #062226; --good: #0ca30c; --good-ink: #39c239; --warn: #e3a52b; --warn-wash: #3a2d10; --crit: #e66767; --crit-wash: #3b1c1c;
    --c-smod: #9085e9; --c-bbmod: #3987e5; --c-rmod: #d95926; --c-ald: #199e70; --c-other: #898781; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    --map-sea: #0a1416; --map-land: #17252a; --map-border: #34494d; --map-lake: #0e1f25; --map-label: #9fb3b5; --map-halo: #0a1416; --map-dark: 1;
    --ping-ok: #3fbf6a; --ping-loss: #f2cf3a; --ping-down: #f0625c; --ping-wait: #536467;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1314; --surface: #131e20; --surface-2: #192729; --ink: #e2ebeb; --ink-2: #b2c2c3; --muted: #84989a;
  --line: #283a3c; --line-2: #1f2e30; --line-strong: #46595b; --accent: #38b8c1; --accent-ink: #7dd6dc; --accent-wash: #11343a;
  --on-accent: #062226; --good: #0ca30c; --good-ink: #39c239; --warn: #e3a52b; --warn-wash: #3a2d10; --crit: #e66767; --crit-wash: #3b1c1c;
  --c-smod: #9085e9; --c-bbmod: #3987e5; --c-rmod: #d95926; --c-ald: #199e70; --c-other: #898781; --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark;
    --map-sea: #0a1416; --map-land: #17252a; --map-border: #34494d; --map-lake: #0e1f25; --map-label: #9fb3b5; --map-halo: #0a1416; --map-dark: 1;
    --ping-ok: #3fbf6a; --ping-loss: #f2cf3a; --ping-down: #f0625c; --ping-wait: #536467;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- app bar ---------- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-in { max-width: 1680px; margin: 0 auto; display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; font: 600 17px/1 var(--f-display); letter-spacing: .01em; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.brand-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.brand-note { font: 400 10.5px/1.15 var(--f-body, system-ui, sans-serif); letter-spacing: 0; color: var(--muted); white-space: normal; }
@media (max-width: 760px) { .brand-name { font-size: 15px; } .brand-note { font-size: 10px; } }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav a { font: 500 13px/1 var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); text-decoration: none; padding: 8px 10px; border-radius: 5px; }
.nav a:hover { background: var(--surface-2); }
.nav a.on { color: var(--accent-ink); background: var(--accent-wash); }
.nav a.off { opacity: .45; pointer-events: none; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.jump { position: relative; }
.jump input { width: 230px; max-width: 46vw; }
.jump-list { position: absolute; right: 0; top: calc(100% + 4px); width: 340px; max-width: 90vw; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; z-index: 40; }
.jump-list a { display: block; padding: 7px 9px; border-radius: 5px; text-decoration: none; color: var(--ink); }
.jump-list a:hover, .jump-list a.hl { background: var(--surface-2); }
.jump-list small { color: var(--muted); }
.filterbar { border-top: 1px solid var(--line-2); background: var(--surface); }
.filterbar.on { background: var(--accent-wash); border-top-color: transparent; }
.filterbar-in { max-width: 1680px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.filterbar label.fb { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.filterbar input[type="date"] { padding: 3px 8px; }
.filterbar .info { font-size: 12.5px; color: var(--ink-2); }
.filterbar .info b { color: var(--ink); font-weight: 600; }
.loadpill { font: 500 12px var(--f-body); color: var(--ink-2); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.loadpill .mini { width: 80px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.loadpill .mini i { display: block; height: 100%; background: var(--accent); }

main { max-width: 1680px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- type ---------- */
h1 { font: 600 26px/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .005em; }
h2 { font: 600 17px/1.25 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h3 { font: 600 14px/1.3 var(--f-display); margin: 0; letter-spacing: .02em; }
.eyebrow { font: 500 11px/1.3 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--ink-2); max-width: 68ch; margin: 6px 0 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: -.01em; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nowrap { white-space: nowrap; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- surfaces ---------- */
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack > * { flex-shrink: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-bottom: 1px solid var(--line-2); }
.card-b { padding: 14px 16px; min-width: 0; }
.card-b.flush { padding: 0; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 12px 14px; min-width: 0; }
.kpi .v { font: 600 26px/1.1 var(--f-display); margin-top: 3px; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.kpi.alert .v { color: var(--crit); }
.kpi.click { cursor: pointer; }
.kpi.click:hover { background: var(--surface-2); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.35; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-ink); padding-inline: 6px; }
.btn.ghost:hover { background: var(--accent-wash); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--ink); color: var(--surface); }
input[type="search"], input[type="text"], input[type="password"], input[type="date"], input[type="number"], textarea, select { border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); padding: 6px 10px; font-size: 13px; min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 12.5px; width: 100%; resize: vertical; line-height: 1.5; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--accent); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--line-strong); }
button.chip.on { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.crit { background: var(--crit-wash); border-color: transparent; color: var(--crit); }
.chip.warn { background: var(--warn-wash); border-color: transparent; color: var(--warn); }
.chip.ok { color: var(--good-ink); }
.chip.acc { background: var(--accent-wash); border-color: transparent; color: var(--accent-ink); }
.chip.filter { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-ink); }
.chip.filter button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 2px; font-size: 14px; line-height: 1; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.state { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.state.ok::before { background: var(--good); }
.state.bad { color: var(--crit); }
.state.bad::before { background: var(--crit); }

/* ---------- tables ---------- */
.tw { overflow: auto; min-width: 0; }
.tw.tall { max-height: 70vh; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th { text-align: left; font: 500 11px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 2; white-space: nowrap; }
.t th.sort { cursor: pointer; user-select: none; }
.t th.sort:hover { color: var(--ink); }
.t th.sort.on { color: var(--accent-ink); }
.t th.sort.on::after { content: " \2193"; }
.t th.sort.on.asc::after { content: " \2191"; }
.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t td:last-child, .t th:last-child { padding-right: 16px; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--surface-2); }
.t tr.sel td { background: var(--accent-wash); }
.t td.rare { background: var(--warn-wash); }
.t tr.snhit td { background: var(--accent-wash); }
.t td.k { color: var(--ink-2); }
.t.compact td { padding: 4px 10px; }
.t .sticky-col { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.t th.sticky-col { z-index: 3; }
.t input.nm { width: 100%; min-width: 150px; padding: 3px 8px; font-size: 13px; border-color: var(--line); }
.t input.nm:placeholder-shown { border-style: dashed; }
.t input.nm:hover, .t input.nm:focus { border-color: var(--line-strong); border-style: solid; }


/* ---------- IPsec Relations: dense full-width relationship table ---------- */
.ipsec-card .card-h { padding: 10px 12px; }
.ipsec-card .card-b { padding: 0; }
.ipsec-table-wrap { overflow-x: auto; min-width: 0; }
table.ipsec-table { width: 100%; min-width: 760px; table-layout: fixed; font-size: 11.5px; }
.ipsec-table th { padding: 7px 7px; font-size: 9.5px; letter-spacing: .055em; }
.ipsec-table td { padding: 6px 7px; vertical-align: middle; line-height: 1.25; }
.ipsec-table th:nth-child(1), .ipsec-table td:nth-child(1) { width: 13%; }
.ipsec-table th:nth-child(2), .ipsec-table td:nth-child(2) { width: 12%; }
.ipsec-table th:nth-child(3), .ipsec-table td:nth-child(3) { width: 21%; }
.ipsec-table th:nth-child(4), .ipsec-table td:nth-child(4) { width: 19%; }
.ipsec-table th:nth-child(5), .ipsec-table td:nth-child(5) { width: 17%; }
.ipsec-table th:nth-child(6), .ipsec-table td:nth-child(6) { width: 13%; }
.ipsec-table th:nth-child(7), .ipsec-table td:nth-child(7) { width: 5%; }
.ipsec-primary, .ipsec-secondary { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ipsec-primary { font-size: 11.5px; }
.ipsec-secondary { margin-top: 2px; color: var(--muted); font-size: 10.5px; }
.ipsec-objectline { display: flex; align-items: center; gap: 5px; min-width: 0; }
.ipsec-objectline > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ipsec-selector { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 6px; align-items: center; }
.ipsec-selector .lbl { color: var(--muted); font: 500 9px/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.ipsec-selector .addr { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ipsec-role { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ipsec-table .chip { padding: 0 5px; font-size: 10px; line-height: 1.45; }
.ipsec-table .num { padding-left: 3px; padding-right: 7px; }
@media (max-width: 980px) {
  table.ipsec-table { min-width: 720px; font-size: 11px; }
  .ipsec-table th { padding-inline: 5px; font-size: 9px; }
  .ipsec-table td { padding: 5px; }
  .ipsec-secondary { font-size: 10px; }
  .ipsec-table th:nth-child(1), .ipsec-table td:nth-child(1) { width: 12%; }
  .ipsec-table th:nth-child(2), .ipsec-table td:nth-child(2) { width: 11%; }
  .ipsec-table th:nth-child(3), .ipsec-table td:nth-child(3) { width: 22%; }
  .ipsec-table th:nth-child(4), .ipsec-table td:nth-child(4) { width: 19%; }
  .ipsec-table th:nth-child(5), .ipsec-table td:nth-child(5) { width: 18%; }
  .ipsec-table th:nth-child(6), .ipsec-table td:nth-child(6) { width: 13%; }
  .ipsec-table th:nth-child(7), .ipsec-table td:nth-child(7) { width: 5%; }
}

/* ---------- inline bars ---------- */
.hbar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.hbar .track { flex: 1; height: 10px; position: relative; }
.hbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.spreadbar { display: flex; height: 10px; gap: 2px; min-width: 90px; }
.spreadbar i { display: block; height: 100%; background: var(--accent); min-width: 2px; }
.spreadbar i:first-child { border-radius: 2px 0 0 2px; }
.spreadbar i.rest { background: var(--line-strong); }
.spreadbar i.unset { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.catbars { display: flex; flex-direction: column; gap: 2px; }
.catbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; text-align: left; background: none; width: 100%; }
.catbar:hover { background: var(--surface-2); }
.catbar.on { background: var(--accent-wash); border-color: var(--accent); }
.catbar .nm { display: flex; align-items: center; gap: 7px; font-weight: 500; min-width: 0; }
.catbar .tr { grid-column: 1 / -1; height: 8px; }
.catbar .tr i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }

/* ---------- layout grids ---------- */
.g-hw { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.g-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.g-params { display: grid; grid-template-columns: 240px minmax(0, 1fr) 390px; gap: 16px; align-items: start; }
.g-objs { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.pane { position: sticky; top: calc(var(--hdr-h, 64px) + 8px); max-height: calc(100vh - var(--hdr-h, 64px) - 24px); display: flex; flex-direction: column; }
.pane .tw, .pane .scrolly { overflow: auto; min-height: 0; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 100vw); z-index: 50; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer > .card-b { overflow: auto; flex: 1; min-height: 0; }
.drawer-only { display: none; }
@media (max-width: 1359px) {
  .g-params { grid-template-columns: 230px minmax(0, 1fr); }
  .g-params > .detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 100vw); max-height: none; z-index: 50; border-radius: 0; box-shadow: var(--shadow);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .g-params > .detail.none { display: none; }
  .g-params > .detail .drawer-only { display: inline-flex; }
}

/* ---------------- derived data: plumbing (from cable links) ---------------- */
const FAM = {LTE: {label: 'LTE', color: '--s1'}, NR: {label: 'NR', color: '--s2'}, 'LTE+NR': {label: 'LTE + NR on one radio', color: '--s3'}, none: {label: 'No cells', color: '--c-other'}};
const famDot = f => `<span class="dot" style="background:var(${(FAM[f] || FAM.none).color});border-radius:50%"></span>`;
let plNames = null;
function plLabel(cat, code, name) { if (!code) return name || cat; const b = baseCode(code, cat); return mapName(code, cat) || name || (plNames && plNames.get(cat + '|' + b)) || b; }
function learnPlNames() {
  plNames = new Map();
  for (const s of S.sites) { const P = s.pl; if (!P) continue; [['SMOD', P.sm], ['BBMOD', P.bb], ['RMOD', P.rf]].forEach(([cat, list]) => list.forEach(u => { if (u[2]) { const k = cat + '|' + baseCode(u[1], cat); if (!plNames.has(k)) plNames.set(k, u[2]); } })); }
}
const bandNum = b => +String(b).replace(/\D/g, '') || 999;
function carriesOf(tm) {

function famOf(tm) { const l = tm.has('LTE') || tm.has('NB-IoT'), n = tm.has('NR'); return l && n ? 'LTE+NR' : l ? 'LTE' : n ? 'NR' : 'none'; }

function countLabel(labels) { const m = new Map(); labels.forEach(l => m.set(l, (m.get(l) || 0) + 1)); return [...m.entries()].sort((a, b) => b[1] - a[1] || cmp(a[0], b[0])).map(([l, n]) => n + '× ' + l).join(', '); }
function plumbData() {
  const key = [vkey(), S.map.ver].join('|');

  const D = {key, sites: 0, noPl: 0, radios: 0, rSplit: 0, rShared: 0, rUncabled: 0, cards: 0, cShared: 0, cIdle: 0, sSep: 0, sSharedSm: 0, sSingle: 0, conns: 0, pooled: 0,
    flows: new Map(), rf: new Map(), bb: new Map(), sm: new Map(), site: new Map()};
  const bump = (map, k, init, uid, add) => { let r = map.get(k); if (!r) { r = Object.assign({n: 0, sites: new Set()}, init); map.set(k, r); } r.n++; r.sites.add(uid); if (add) add(r); };

  for (const s of V()) {
    const P = s.pl;
    if (!P || !P.rf.length) { D.noPl++; continue; }
    D.sites++;
    if (P.cells.some(c => c[4])) D.pooled++;
    const smL = P.sm.map(m => plLabel('SMOD', m[1], m[2])), bbL = P.bb.map(b => plLabel('BBMOD', b[1], b[2])), rfL = P.rf.map(r => plLabel('RMOD', r[1], r[2]));

    const refSm = ref => ref[0] === 'b' ? P.bb[+ref.slice(1)][3] : +ref.slice(1);

      const t = famName(smFams[si]);
      const direct = (cardRadios.get('s' + si) || []).length;
      const cl = cards.length ? countLabel(cards) : 'No baseband cards';
      bump(D.sm, [smL[si], m[3] || '', cl, t, direct ? 'y' : 'n'].join('|'), {sm: smL[si], role: m[3] || '–', cards: cl, fam: t, direct: 0}, s.uid, x => { x.direct += direct; });
    });
    const siteF = famSet(rFam);

    const cardSplit = siteF.size < 2 ? '–' : sharedCards ? 'Some cards carry both' : 'Separate cards';

    bump(D.site, [smSet, smSplit, cardSplit, split ? 'y' : 'n', shared ? 'y' : 'n'].join('|'), {smSet, smSplit, cardSplit, split: !!split, shared: !!shared, splitN: 0, sharedN: 0, sharedCards: 0}, s.uid, x => { x.splitN += split; x.sharedN += shared; x.sharedCards += sharedCards; });

}

/* ---------------- flow diagram (alluvial) ---------------- */
function alluvial(D) {
  const COLS = ['Radio type', 'Carries', 'Baseband card · cabled', 'System module · backplane'];
  const flows = [...D.flows.values()];
  if (!flows.length) return {svg: '<div class="empty">No cable links between radios and baseband cards were found.</div>', nodes: [], links: []};
  const K = 12, FAMS = ['LTE', 'LTE+NR', 'NR', 'none'];
  const caps = [0, 1, 2, 3].map(ci => { const m = new Map(); flows.forEach(f => m.set(f.path[ci], (m.get(f.path[ci]) || 0) + f.n)); const sorted = [...m.entries()].sort((a, b) => b[1] - a[1]); return {keep: new Set(sorted.slice(0, K).map(x => x[0])), other: sorted.length - Math.min(K, sorted.length)}; });
  const lab = (ci, l) => caps[ci].keep.has(l) ? l : 'Other (' + caps[ci].other + ' more)';
  const cols = [0, 1, 2, 3].map(() => new Map()), lmap = new Map();
  flows.forEach(f => {
    const p = f.path.map((l, ci) => lab(ci, l));
    p.forEach((l, ci) => { let nd = cols[ci].get(l); if (!nd) { nd = {ci, label: l, v: 0, sites: new Set(), fam: {}, out: [], inn: []}; cols[ci].set(l, nd); } nd.v += f.n; nd.fam[f.fam] = (nd.fam[f.fam] || 0) + f.n; f.sites.forEach(u => nd.sites.add(u)); });
    for (let ci = 0; ci < 3; ci++) {
      const k = ci + '\u0001' + p[ci] + '\u0001' + p[ci + 1] + '\u0001' + f.fam;
      let lk = lmap.get(k);
      if (!lk) { lk = {ci, s: cols[ci].get(p[ci]), t: cols[ci + 1].get(p[ci + 1]), fam: f.fam, v: 0, sites: new Set()}; lmap.set(k, lk); lk.s.out.push(lk); lk.t.inn.push(lk); }
      lk.v += f.n; f.sites.forEach(u => lk.sites.add(u));
    }
  });
  const links = [...lmap.values()];
  const domFam = nd => FAMS.indexOf(Object.entries(nd.fam).sort((a, b) => b[1] - a[1])[0][0]);
  const order = [];
  order[0] = [...cols[0].values()].sort((a, b) => domFam(a) - domFam(b) || b.v - a.v || cmp(a.label, b.label));
  order[0].forEach((n, i) => { n.rank = i; });
  for (let ci = 1; ci < 4; ci++) {
    const arr = [...cols[ci].values()];
    arr.forEach(n => { let w = 0, s = 0; n.inn.forEach(l => { w += l.v; s += l.v * l.s.rank; }); n.bary = w ? s / w : 0; });
    arr.sort((a, b) => a.bary - b.bary || b.v - a.v);
    arr.forEach((n, i) => { n.rank = i; });
    order[ci] = arr;
  }
  // re-sort the first column by where its flows go, to cut crossings
  order[0].forEach(n => { let w = 0, s = 0; n.out.forEach(l => { w += l.v; s += l.v * l.t.rank; }); n.bary = w ? s / w : 0; });
  order[0].sort((a, b) => domFam(a) - domFam(b) || a.bary - b.bary || b.v - a.v); order[0].forEach((n, i) => { n.rank = i; });
  const total = flows.reduce((a, f) => a + f.n, 0);
  const maxN = Math.max(...order.map(o => o.length));
  const W = 1120, top = 34, gap = 10, nw = 10, H = Math.max(340, Math.min(1000, maxN * 36 + top + 16));
  const k = Math.min(...order.map(o => (H - top - 12 - gap * (o.length - 1)) / total));
  const xL = 210, xR = W - 200 - nw, xs = [0, 1, 2, 3].map(i => xL + (xR - xL) * i / 3);
  order.forEach((o, ci) => {
    const used = o.reduce((a, n) => a + Math.max(2, n.v * k), 0) + gap * (o.length - 1);
    let y = top + Math.max(0, (H - top - 12 - used) / 2);
    o.forEach(n => { n.x = xs[ci]; n.y = y; n.h = Math.max(2, n.v * k); y += n.h + gap; });
  });
  order.forEach(o => o.forEach(n => {
    let y = n.y; n.out.sort((a, b) => a.t.y - b.t.y || FAMS.indexOf(a.fam) - FAMS.indexOf(b.fam)).forEach(l => { l.y0 = y; y += l.v * k; });
    y = n.y; n.inn.sort((a, b) => a.s.y - b.s.y || FAMS.indexOf(a.fam) - FAMS.indexOf(b.fam)).forEach(l => { l.y1 = y; y += l.v * k; });
  }));
  const trunc = (t, m) => t.length > m ? t.slice(0, m - 1) + '…' : t;
  let svg = `<svg class="alluvial" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cable paths from radio type to system module">`;
  COLS.forEach((c, i) => { svg += `<text class="colh" x="${i === 0 ? xs[0] + nw : xs[i]}" y="16" text-anchor="${i === 0 ? 'end' : 'start'}">${esc(c)}</text>`; });
  links.forEach((l, i) => {
    const x0 = l.s.x + nw, x1 = l.t.x, xm = (x0 + x1) / 2, h = l.v * k;
    svg += `<path class="rib" data-l="${i}" style="fill:var(${(FAM[l.fam] || FAM.none).color})" d="M${x0},${l.y0} C${xm},${l.y0} ${xm},${l.y1} ${x1},${l.y1} L${x1},${l.y1 + h} C${xm},${l.y1 + h} ${xm},${l.y0 + h} ${x0},${l.y0 + h} Z"/>`;
  });
  const nodes = [];
  order.forEach((o, ci) => o.forEach(n => {
    const i = nodes.length; nodes.push(n);
    svg += `<rect class="nd" data-n="${i}" x="${n.x}" y="${n.y}" width="${nw}" height="${n.h}" rx="2"/>`;
    const ty = n.y + n.h / 2 + 4, left = ci === 0;
    svg += `<text class="nl" data-n="${i}" x="${left ? n.x - 6 : n.x + nw + 6}" y="${ty}" text-anchor="${left ? 'end' : 'start'}">${esc(trunc(n.label, ci === 3 ? 26 : 28))}<tspan class="nv"> ${fmt(n.v)}</tspan></text>`;
  }));
  svg += '</svg>';
  return {svg, nodes, links, total};
}

function histSvg(P) {
  const lo = P.min, hi = P.max;

  return `<div><div class="eyebrow" style="margin-bottom:4px">Histogram${P.over ? ' (values beyond the first ' + MAXV + ' distinct are not binned)' : ''}</div><svg class="hist" viewBox="0 0 ${w} ${h}" role="img" aria-label="Histogram of values">${bars}<line x1="${pl}" x2="${w - pr}" y1="${h - pb + .5}" y2="${h - pb + .5}"/><text x="${pl}" y="${h - 6}">${esc(fmtNum(lo))}</text><text x="${w - pr}" y="${h - 6}" text-anchor="end">${esc(fmtNum(hi))}</text></svg></div>`;
}

async function findAllSites(c, k, val) {
  // Re-scan files that contain this class to find every site holding cls.param = val
  const target = new Set();
  toast('Searching all files… this re-reads every file once');
  const L = {cancel: false};
  let done = 0;
  const visFiles = new Set(V().map(s => s.file)), vis = visInfo().set;
  for (let i = 0; i < S.files.length; i++) {
    if (!visFiles.has(i)) continue;
    const f = S.files[i];
    try {
      const text = await readFileText(f);
      parseRaml(text, mo => { if (shortCls(mo.c) !== c) return; for (let j = 0; j < mo.p.length; j += 3) if (mo.p[j] === k && normVal(mo.p[j + 1]) === val) { const sp = splitDn(mo.d); if (sp) target.add(i + ':' + sp.site); break; } });
    } catch (e) { /* skip unreadable */ }
    if (++done % 5 === 0) { if (done % 50 === 0) toast(`Searching… ${fmt(done)} / ${fmt(S.files.length)} files`); await tick(); }
    if (L.cancel) break;
  }
  target.forEach(u => { if (!vis.has(u)) target.delete(u); });
  S.siteFilter = {type: 'uids', uids: target, label: `${c}.${k} = ${val === '' ? '(empty)' : val}`};

/* ---------- objects carrying a parameter (original DN level) ----------

   optionally only those whose value equals val. The DN is the distName string exactly as in the file. */
const OBJ_NAME_KEYS = ['cellName', 'name', 'enbName', 'gnbName', 'btsName', 'userLabel'];
async function paramObjectsExport(c, k, val) {
  const asExcel = XL.armed; XL.armed = false; clearTimeout(XL.timer);   // the file reading can outlast the Excel flag
  const visFiles = new Set(V().map(s => s.file)), vis = visInfo().set;
  const rows = [['mrbts_id', 'site_name', 'region', 'dn', 'object', 'class', 'parameter', 'value', 'list_item', 'object_name', 'file']];
  const total = visFiles.size; let done = 0, failed = 0;
  toast('Reading ' + fmt(total) + ' files for the object list…');
  for (let i = 0; i < S.files.length; i++) {
    if (!visFiles.has(i)) continue;
    let text;
    try { text = await readFileText(S.files[i]); } catch (e) { failed++; continue; }
    parseRaml(text, mo => {
      if (shortCls(mo.c) !== c) return;
      const p = mo.p; let sp, s, nm;
      for (let j = 0; j < p.length; j += 3) {
        if (p[j] !== k) continue;
        const v = p[j + 1];
        if (val !== undefined && normVal(v) !== val) continue;
        if (sp === undefined) {
          sp = splitDn(mo.d);
          s = sp && vis.has(i + ':' + sp.site) ? S.byUid.get(i + ':' + sp.site) : null;
          nm = '';
          for (const key of OBJ_NAME_KEYS) { for (let q = 0; q < p.length; q += 3) if (p[q] === key && p[q + 1]) { nm = p[q + 1]; break; } if (nm) break; }
        }
        if (!s) return;
        rows.push([s.id, s.name, s.region, mo.d, lastSeg(mo.d), c, k, v, p[j + 2] || '', nm, fileName(s)]);
      }
    });
    if (++done % 10 === 0) { if (done % 100 === 0) toast(`Reading files… ${fmt(done)} / ${fmt(total)}`); await tick(); }
  }
  if (rows.length === 1) { toast('No object has ' + c + '.' + k + (val !== undefined ? ' = ' + (val === '' ? '(empty)' : val) : '') + ' in the shown sites.'); return; }
  const tag = val === undefined ? '' : '_' + (val === '' ? 'empty' : String(val).replace(/[^A-Za-z0-9_.-]+/g, '_').slice(0, 40));
  XL.armed = asExcel;
  download(`objects_${c}_${k.replace(/[^A-Za-z0-9_.-]+/g, '_')}${tag}.csv`, toCsv(rows), 'text/csv');
  if (!asExcel) toast(`${fmt(rows.length - 1)} objects exported${failed ? ' (' + failed + ' files could not be read)' : ''}`);
}

});

function showTip(e, html) {

/* ---------------- jump box ---------------- */
(function () {
  const inp = $('#jump'), box = $('#jumplist');
  let hits = [], hl = 0;
  const draw = () => {
    const vis = visInfo().set;
    box.innerHTML = hits.map((s, i) => { const u = snHit.get(s); return `<a href="#site/${encodeURIComponent(s.uid)}/${u ? 'inv' : (S.siteTab || 'topo')}" data-i="${i}" class="${i === hl ? 'hl' : ''}"><span class="mono">${esc(s.id)}</span> ${esc(s.name)}<br><small>${u ? `S/N <span class="mono">${esc(u[4])}</span> · ${esc(u[1])} ${esc(lastSeg(u[6] || u[5]))}` : esc([s.region, s.subregion, expDay(s)].filter(Boolean).join(' · '))}${vis.has(s.uid) ? '' : ' · hidden by the date filter'}</small></a>`; }).join('') || '<div class="small muted" style="padding:8px">No matching site</div>';
    box.hidden = !inp.value.trim();
  };
  let snHit = new Map(); // site -> unit whose serial matched
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase(); hl = 0;
    if (!q) { hits = []; box.hidden = true; return; }
    hits = []; snHit = new Map();
    for (const s of S.sites) { if (s.id.toLowerCase().startsWith(q)) hits.push(s); if (hits.length >= 8) break; }
    if (hits.length < 8) for (const s of S.sites) { if (!hits.includes(s) && (s.name + ' ' + s.enb).toLowerCase().includes(q)) hits.push(s); if (hits.length >= 8) break; }
    if (hits.length < 8 && /^\d{1,3}\.\d/.test(q)) for (const s of S.sites) { if (!hits.includes(s) && s.mpl && s.mpl.startsWith(q)) hits.push(s); if (hits.length >= 8) break; }
    if (hits.length < 8) for (const s of S.sites) { if (hits.includes(s)) continue; const u = serialHits(s, q)[0]; if (u) { hits.push(s); snHit.set(s, u); } if (hits.length >= 8) break; }
    draw();
  });
  const go = s => {
    const u = snHit.get(s);
    if (u) { S.invHi = u[4]; location.hash = '#site/' + encodeURIComponent(s.uid) + '/inv'; }
    else location.hash = '#site/' + encodeURIComponent(s.uid) + '/' + (S.siteTab || 'topo');
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { hl = Math.min(hits.length - 1, hl + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hl = Math.max(0, hl - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && hits[hl]) { go(hits[hl]); inp.value = ''; box.hidden = true; inp.blur(); }
    else if (e.key === 'Escape') { inp.value = ''; box.hidden = true; }
  });
  box.addEventListener('click', e => { const a = e.target.closest('a[data-i]'); if (a && hits[+a.dataset.i] && snHit.get(hits[+a.dataset.i])) S.invHi = snHit.get(hits[+a.dataset.i])[4]; inp.value = ''; box.hidden = true; });
  document.addEventListener('click', e => { if (!e.target.closest('.jump')) box.hidden = true; });
})();

/* ---------------- view: map (sites by GPS position) ----------------
   Web Mercator on a canvas. The New Zealand outline, lakes and towns are built in (Natural Earth 1:10m,

  }
  // scale bar
  const lat = -Math.atan(Math.sinh(Math.PI * (2 * E.v.cy - 1))) * 180 / Math.PI;
  const mPerPx = 40075016.7 * Math.cos(lat * Math.PI / 180) / ws;
  const nice = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000];
  const m = nice.find(v => v / mPerPx >= 70) || 500000, px = m / mPerPx;
  ctx.fillStyle = col('--map-label'); ctx.strokeStyle = col('--map-label'); ctx.lineWidth = 1.5; ctx.font = `500 11px ${font}`;
  ctx.beginPath(); ctx.moveTo(14, h - 26); ctx.lineTo(14, h - 20); ctx.lineTo(14 + px, h - 20); ctx.lineTo(14 + px, h - 26); ctx.stroke();
  ctx.textBaseline = 'alphabetic'; ctx.lineWidth = 3; ctx.strokeStyle = col('--map-halo');
  const sl = m >= 1000 ? m / 1000 + ' km' : m + ' m';
  ctx.strokeText(sl, 18, h - 29); ctx.fillText(sl, 18, h - 29);
}

function mapHitAt(E, x, y) {
  const r = (E.v.z < 6 ? 2.6 : E.v.z < 8 ? 3.4 : E.v.z < 11 ? 4.4 : 5.4) * (E.D.mode.rScale || 1) + 5;
  let best = null, bd = r * r;
  for (const h of E.hit) { const d = (h.x - x) ** 2 + (h.y - y) ** 2; if (d <= bd) { bd = d; best = h; } }
  return best;
}

// opts: viewKey (where the view is kept in S), refit (fit to the lit points now), onBox(worldBox | null) enables area selection
function mapBind(D, focusUid, opts) {
  opts = opts || {};

  });
  cv.addEventListener('pointermove', e => {

    if (E.ptr.has(e.pointerId)) E.ptr.set(e.pointerId, {x, y});
    if (E.pinch && E.ptr.size === 2) {
      const [a, b] = [...E.ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt(E, (a.x + b.x) / 2, (a.y + b.y) / 2, E.pinch.z + Math.log2(d / E.pinch.d) - E.v.z); return;
    }

      if (E.drag.moved) { const ws = mapWS(E); E.v.cx = E.drag.cx - dx / ws; E.v.cy = Math.max(0, Math.min(1, E.drag.cy - dy / ws)); mapRedraw(); }
      return;

    else if (hit) { const s = hit.p.s; showTip(e, `<b>${esc(s.name || 'MRBTS-' + s.id)}</b><br>MRBTS-${esc(s.id)} · ${hit.p.dim ? 'not in the selection' : esc(hit.p.cat)}${s.region ? '<br>' + esc(s.region) : ''}${opts.tipExtra ? opts.tipExtra(s) : ''}`); }

    const [x, y] = local(e);

  };

    else if (e.key === 'Escape') { if (E.box || E.areaMode) { E.box = null; setArea(false); mapRedraw(); return; } select(null); return; }
    else return;

    else if (a === 'cat') { const set = new Set(MAPS.hide[D.key] || []); if (set.has(v)) set.delete(v); else set.add(v); MAPS.hide[D.key] = [...set]; saveMapPrefs(); rerender(); }
    else if (a === 'zin' || a === 'zout') zoomAt(E, E.w / 2, E.h / 2, a === 'zin' ? 1 : -1);
    else if (a === 'fit') { const hid = MAPS.hide[D.key] || [], lp = D.pts.filter(p => !p.dim && !hid.includes(p.cat)); mapFit(E, sitesBox(lp.length ? lp : D.pts), 13); mapRedraw(); }
    else if (a === 'area') setArea(!E.areaMode);

    else if (a === 'nz') { mapFit(E, nzWorldBox(), 13); mapRedraw(); }
    else if (a === 'close') select(null);
    else if (a === 'clearfilter') { S.siteFilter = null; rerender(); }
    else if (a === 'clearsearch') { S.siteSearch = ''; rerender(); }
    else if (a === 'nocoord') { S.siteFilter = {type: 'uids', uids: new Set(D.noCoord.map(s => s.uid)), label: 'No GPS coordinates'}; S.siteSearch = ''; S.sitePage = 0; location.hash = '#sites'; }
    else if (a === 'tiles-save') {
      const p = tilePreset();

      if (p.key) { const k = $('#map-key').value.trim(); if (!k) { toast('Paste the API key first.'); return; } MAPS.keys[p.key] = k; }
      if (p.layer) { const l = $('#map-layer').value.trim().replace(/^\/+|\/+$/g, ''); if (!/^(layer|set)=\d+(;(layer|set)=\d+)*$/.test(l)) { toast('The layer looks like set=4702 or layer=50767.'); return; } MAPS.ldsLayer = l; }
      const rk = $('#map-keyremember'); if (rk) MAPS.rememberKeys = rk.checked;

  }));
  const tsel = $('#map-tilesel');
  if (tsel) tsel.addEventListener('change', () => { MAPS.tileId = tsel.value; S.tileSetOpen = true; saveMapPrefs(); resetTiles(); rerender(); });

const PG_LABEL = {ok: 'All replies', loss: 'Some loss', down: 'No replies', wait: 'Waiting', error: 'Not tested', noaddr: 'Not tested', none: 'Not tested'};
const PG_CLASS = {ok: 'ok', loss: 'loss', down: 'down', wait: 'wait', error: 'na', noaddr: 'na', none: 'na'};
MAP_MODES.ping = {label: 'Ping', hideZero: true, rScale: 1.45, stackWorst: true, cats: [['All replies', '--ping-ok'], ['Some loss', '--ping-loss'], ['No replies', '--ping-down'], ['Waiting', '--ping-wait'], ['Not tested', '--c-other']],
  drawOrder: ['Not tested', 'Waiting', 'All replies', 'Some loss', 'No replies'], of: s => PG_LABEL[pgState(s)]};

/* ---------- which address, which sites ---------- */
function pgRanges() {
  return String(S.pg.form.ranges || '').split(/[\s,;]+/).map(x => x.trim()).filter(Boolean)
    .map(x => x.endsWith('.') || x.split('.').length >= 4 ? x : x + '.');
}
const pgInRanges = ip => { const r = pgRanges(); return !r.length || r.some(p => ip.startsWith(p)); };
// [address, how]: how = 'mplane' (MPLANENW reference) | 'range' (no reference; first own address in the OAM ranges) | ''
function oamOf(s) {
  if (s.mpl) return [s.mpl, 'mplane'];
  const r = pgRanges();
  const a = r.length && (s.ip || []).find(x => IP4_RE.test(x[0]) && r.some(p => x[0].startsWith(p)));
  return a ? [a[0], 'range'] : ['', ''];
}
const pgPrefixes = () => String(S.pg.form.prefixes || '').split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
const pgUsesFilter = () => !!(S.pg.form.useFilter && (S.siteFilter || S.siteSearch.trim()));
function pgCandidates() {
  const pre = pgPrefixes(), reg = S.pg.form.region;
  return (pgUsesFilter() ? filteredSites() : V()).filter(s => (!reg || s.region === reg)
    && (!pre.length || pre.some(p => (s.name || '').toLowerCase().startsWith(p) || String(s.id).toLowerCase().startsWith(p))));
}
function pgInArea(s) {
  const a = S.pg.area;
  if (!a) return true;
  if (!siteHasCoord(s)) return false;
  const x = wx(s.lon), y = wy(s.lat);
  return x >= a[0] && x <= a[2] && y >= a[1] && y <= a[3];
}
function pgTargets(sel) {
  const targets = [], noAddr = [], byRange = [], outside = [], seen = new Set();
  sel.forEach(s => {
    const [ip, how] = oamOf(s);
    if (!ip) { noAddr.push(s); return; }
    if (how === 'range') byRange.push(s);
    else if (!pgInRanges(ip)) outside.push(s);
    targets.push({ip, id: s.id, name: s.name, role: how === 'range' ? 'OAM range (no M-plane reference)' : 'M-plane', uid: s.uid});
    seen.add(ip);
  });
  return {targets, noAddr, byRange, outside, unique: seen.size};
}
function pgRegions() {
  const m = new Map();
  V().forEach(s => { if (s.region) m.set(s.region, (m.get(s.region) || 0) + 1); });
  return [...m.entries()].sort((a, b) => cmp(a[0], b[0]));
}

/* ---------- results ---------- */
// 'ok' | 'loss' | 'down' | 'wait' | 'error' | 'noaddr' | 'none' (not in the last run)
function pgState(s) {
  const R = S.pg.run;
  if (!R || !R.byUid.has(s.uid)) return 'none';
  const ip = R.byUid.get(s.uid);
  if (!ip) return 'noaddr';
  const r = S.pg.res.get(ip);
  if (!r) return R.active ? 'wait' : 'error';
  return r.state;
}
const pgPill = st => `<span class="pgst ${PG_CLASS[st]}">${esc(PG_LABEL[st])}</span>`;
const pgTime = t => { const d = new Date(t); return isoDay(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function pgRunWhen() { const R = S.pg.run; return R ? pgTime(R.started) + ' from ' + R.host : ''; }
function pgSiteCounts() {
  const c = {ok: 0, loss: 0, down: 0, wait: 0, na: 0};
  const R = S.pg.run;
  if (R) R.uids.forEach(uid => { const s = S.byUid.get(uid); if (!s) return; const k = PG_CLASS[pgState(s)]; c[k]++; });
  return c;
}
function pgInfoRows(s) {   // rows for the map's site card
  const [ip, how] = oamOf(s), st = pgState(s), r = ip ? S.pg.res.get(ip) : null;
  return `<span>M-plane</span><span>${ip ? `<span class="mono">${esc(ip)}</span>${how === 'range' ? ' <span class="small muted">by OAM range</span>' : ''}` : '<span class="muted">none in the file</span>'}</span>`
    + (st !== 'none' ? `<span>Ping</span><span>${pgPill(st)}${r && r.tx ? ` <span class="small muted">${r.rx}/${r.tx} replies${r.avg != null ? ' · ' + r.avg.toFixed(1) + ' ms' : ''}</span>` : ''}</span>` : '');
}

/* ---------- run ---------- */
async function pgStart(trust) {
  if (!HELPER || !HELPER.ping) { location.hash = '#ping'; return; }
  if (pgBusy()) return;
  const f = S.fx.form, o = S.pg.form;
  const fail = msg => { S.pg.st = {state: 'error', message: msg}; pgUpdate(); };
  if (!f.host.trim() || !f.user.trim()) return fail('Fill in the server and the username: the server you fetch the SCF files from.');
  if (!HELPER.paramiko) return fail('The helper is running without paramiko, so it cannot use SSH. Close the helper window, run "python -m pip install paramiko", then start it again.');
  const sel = pgCandidates().filter(pgInArea), T = pgTargets(sel);
  if (!T.targets.length) return fail(sel.length ? 'None of the selected sites has an M-plane address in its file.' : 'No sites are selected.');
  const byUid = new Map();
  sel.forEach(s => byUid.set(s.uid, oamOf(s)[0]));
  const opts = {count: +o.count || 5, wait: +o.wait || 2, interval: +o.interval || 1, parallel: +o.parallel || 20, file: (o.file || PG_DEFAULT.file).trim()};
  // the previous results stay until this run reaches the server (restored if it fails before that)
  if (S.pg.run) S.pg.prev = {run: S.pg.run, res: S.pg.res};
  S.pg.res = new Map(); S.pg.show = ''; S.pg.pageAll = false;
  S.pg.run = {byUid, uids: sel.map(s => s.uid), host: f.host.trim(), user: f.user.trim(), started: Date.now(), finished: null, active: true, total: T.unique, opts};
  S.pg.st = {state: 'connecting', message: 'Connecting to ' + f.host.trim() + '…', count: 0, total: T.unique};
  pgUpdate();
  try {
    const r = await H.post('pingrun', Object.assign({host: f.host.trim(), port: +f.port || 22, user: f.user.trim(), password: S.fx.password, trust: trust || '',
      targets: T.targets.map(t => ({ip: t.ip, id: t.id, name: t.name, role: t.role}))}, opts));
    S.pg.job = r.job;
    pgPoll(r.job);
  } catch (e) { pgRestore(); fail(e.message); }
}
function pgRestore() {   // a run that never got to ping: show the previous results again (or none)
  const never = !S.pg.res.size && !(S.pg.st && ['pinging', 'done', 'cancelled'].includes(S.pg.st.state));
  if (never) { const P = S.pg.prev; S.pg.run = P ? P.run : null; S.pg.res = P ? P.res : new Map(); }
  else if (S.pg.run) S.pg.run.active = false;
}
async function pgPoll(id) {
  let n = 0;
  for (;;) {
    if (S.pg.job !== id) return;
    let st;
    try { st = await H.get('pingstatus', {job: id, from: n}); }
    catch (e) { if (S.pg.run) S.pg.run.active = false; S.pg.st = {state: 'error', message: 'Lost contact with the helper (' + e.message + '). Is its window still open?'}; pgUpdate(); return; }
    (st.results || []).forEach(r => S.pg.res.set(r.ip, r));
    n = st.count;
    S.pg.st = st;
    const end = !PG_ACTIVE.includes(st.state);
    if (end && S.pg.run) { if (st.state === 'error' || st.state === 'confirm_host') pgRestore(); else { S.pg.run.active = false; S.pg.run.finished = Date.now(); } }
    pgUpdate();
    if (end) break;
    await new Promise(r => setTimeout(r, 500));
  }
  if (S.pg.st.state === 'done') { const c = pgSiteCounts(); toast(`Ping finished: ${c.ok} green, ${c.loss} yellow, ${c.down} red`); }
}

function pgMapData(cands, selSet) {

    const dim = !selSet.has(s.uid), cat = mode.of(s);
    if (!dim) counts.set(cat, (counts.get(cat) || 0) + 1);
    pts.push({s, x: wx(s.lon), y: wy(s.lat), cat, dim});
  }
  sortPts(pts, mode, counts);
  return {key: 'ping', list: cands, pts, noCoord, outside: 0, mode, counts, area: S.pg.area};
}

/* ---------------- view: alarm query (Rundeck) ----------------
   The localhost helper starts the configured Rundeck job with one node filter containing all selected
   sites. Auto-generated BTS node names always use SITE+CLI (for example A5MIS90+CLI), but the complete
   BTS filter is editable before submission. Rundeck output entries are expected to contain JSON with
   requestMessage, matching the existing RundeckAlarmJob.py contract. The API token remains only in
   page/helper memory for the current run. */
const ALARM_KEY = 'mrbts-fleet-alarm-v1';
const ALARM_JOB_ID = '6d66e249-0427-4654-8679-01844bcb53eb';
const AL_DEFAULT = {prefixes: '', region: '', useFilter: false, base: 'https://atc.internal.one.nz:4443', api: 52, job: ALARM_JOB_ID, wait: 6, timeout: 600, verify: false};
S.al = {form: Object.assign({}, AL_DEFAULT, (() => { try { return JSON.parse(lsGet(ALARM_KEY) || '{}'); } catch (e) { return {}; } })()),
  token: '', job: null, st: null, alarms: [], run: null, show: '', search: '', more: false, pageAll: false, filterText: '', filterSig: ''};
if (/^https:\/\/atc\.vodafone\.co\.nz:4443\/?$/i.test(String(S.al.form.base || ''))) S.al.form.base = AL_DEFAULT.base;
S.al.form.job = ALARM_JOB_ID;
const alSave = () => { const f = Object.assign({}, S.al.form); lsSet(ALARM_KEY, JSON.stringify(f)); };
const AL_ACTIVE = ['starting', 'running'];
const alBusy = () => !!(S.al.st && AL_ACTIVE.includes(S.al.st.state));
const AL_SEV_RANK = {CRITICAL: 0, MAJOR: 1, MINOR: 2, WARNING: 3, INDETERMINATE: 4, UNKNOWN: 5, CLEARED: 6};
const alSeverity = a => String(a && a.severity || 'UNKNOWN').trim().toUpperCase() || 'UNKNOWN';
const alSevPill = sev => { sev = String(sev || 'UNKNOWN').toUpperCase(); const cl = /CRITICAL|MAJOR/.test(sev) ? 'crit' : /MINOR|WARNING/.test(sev) ? 'warn' : sev === 'CLEARED' ? 'ok' : ''; return `<span class="chip ${cl}">${esc(sev)}</span>`; };
const alPrefixes = () => String(S.al.form.prefixes || '').split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);
const alUsesFilter = () => !!(S.al.form.useFilter && (S.siteFilter || S.siteSearch.trim()));
function alCandidates() {
  const pre = alPrefixes(), reg = S.al.form.region;
  return (alUsesFilter() ? filteredSites() : V()).filter(s => (!reg || s.region === reg)
    && (!pre.length || pre.some(p => (s.name || '').toLowerCase().startsWith(p) || String(s.id).toLowerCase().startsWith(p))));
}
function alNode(s) {
  const base = String(s.name || s.id || '').trim().replace(/(?:\+|_)cli$/i, '');
  return base ? base + '+CLI' : '';
}
function alTargets(sel) {
  const nodes = [], seen = new Set(), rows = [];
  sel.forEach(s => { const node = alNode(s); if (!node) return; rows.push({s, node}); if (!seen.has(node)) { seen.add(node); nodes.push(node); } });
  return {rows, nodes};
}
const alAutoFilter = nodes => nodes.length ? 'name:' + nodes.join(', ') : '';
function alFilterNodes(text) {
  let raw = String(text || '').trim().replace(/^name\s*:\s*/i, '');
  const nodes = [], seen = new Set();
  raw.split(/[\n,;]+/).forEach(x => {
    const n = x.trim().replace(/^name\s*:\s*/i, '');
    if (n && !seen.has(n)) { seen.add(n); nodes.push(n); }
  });
  return nodes;
}
const alTime = t => pgTime(t);
function alRunWhen() { const R = S.al.run; return R ? alTime(R.started) + ' · job ' + R.job : ''; }
function alSiteFor(a) {
  const R = S.al.run; if (!R) return null;
  const raw = String(a.node || '').trim().toLowerCase();
  let uid = R.byNode.get(raw);
  if (!uid && raw) {
    const tail = raw.split(/[\\/@]/).pop(); uid = R.byNode.get(tail);
  }
  if (!uid) {
    const text = [a.node, a.alarmingObjectIds, a.alarmDetail, a.faultDescription].join(' ').toLowerCase();
    for (const u of R.uids) { const s = S.byUid.get(u); if (!s) continue; const nm = String(s.name || '').toLowerCase(); if ((nm && text.includes(nm)) || text.includes('mrbts-' + String(s.id).toLowerCase())) { uid = u; break; } }
  }
  return uid ? S.byUid.get(uid) || null : null;
}
function alCounts() {
  const c = new Map(), sites = new Set();
  S.al.alarms.forEach(a => { const sev = alSeverity(a); c.set(sev, (c.get(sev) || 0) + 1); const s = alSiteFor(a); if (s) sites.add(s.uid); });
  return {sev: c, sites};
}
async function alStart() {
  if (!HELPER || !HELPER.alarms) { S.al.st = {state: 'error', message: 'The local helper does not support alarm queries. Replace mrbts_fetch.py with the new version and restart it.'}; alUpdate(); return; }
  if (alBusy()) return;
  const o = S.al.form, sel = alCandidates(), T = alTargets(sel);
  const fail = msg => { S.al.st = {state: 'error', message: msg}; alUpdate(); };
  if (!T.nodes.length) return fail('No sites are selected.');
  const nodes = alFilterNodes(S.al.filterText || alAutoFilter(T.nodes));
  if (!nodes.length) return fail('The BTS filter does not contain any Rundeck nodes.');
  if (!S.al.token.trim()) return fail('Enter your Rundeck API token. The token is not saved.');
  const byNode = new Map(), nodeByUid = new Map();
  T.rows.forEach(({s, node}) => { byNode.set(node.toLowerCase(), s.uid); byNode.set(String(s.name || s.id).toLowerCase(), s.uid); nodeByUid.set(s.uid, node); });
  nodes.forEach((node, i) => {
    const low = node.toLowerCase();
    let row = T.rows.find(x => low === x.node.toLowerCase() || low.includes(String(x.s.name || x.s.id).toLowerCase()));
    if (!row && nodes.length === T.rows.length) row = T.rows[i];
    if (row) { byNode.set(low, row.s.uid); nodeByUid.set(row.s.uid, node); }
  });
  S.al.alarms = []; S.al.show = ''; S.al.pageAll = false;
  S.al.run = {uids: sel.map(s => s.uid), byNode, nodeByUid, nodes, filter: 'name:' + nodes.join(', '), started: Date.now(), finished: null, active: true, job: ALARM_JOB_ID, base: String(o.base).trim()};
  S.al.st = {state: 'starting', message: 'Starting Rundeck alarm job…', count: 0, total_nodes: nodes.length};
  alUpdate();
  try {
    const r = await H.post('alarmrun', {base: String(o.base).trim(), api: +o.api || 52, job: ALARM_JOB_ID, token: S.al.token,
      nodes, wait: Number.isFinite(+o.wait) ? +o.wait : 6, timeout: +o.timeout || 600, verify: !!o.verify});
    S.al.job = r.job; alPoll(r.job);
  } catch (e) { if (S.al.run) S.al.run.active = false; fail(e.message); }
}
async function alPoll(id) {
  let n = 0;
  for (;;) {
    if (S.al.job !== id) return;
    let st;
    try { st = await H.get('alarmstatus', {job: id, from: n}); }
    catch (e) { if (S.al.run) S.al.run.active = false; S.al.st = {state: 'error', message: 'Lost contact with the helper (' + e.message + '). Is its window still open?'}; alUpdate(); return; }
    (st.results || []).forEach(a => S.al.alarms.push(a));
    n = st.count || S.al.alarms.length; S.al.st = st;
    const end = !AL_ACTIVE.includes(st.state);
    if (end && S.al.run) { S.al.run.active = false; S.al.run.finished = Date.now(); }
    alUpdate();
    if (end) break;
    await new Promise(r => setTimeout(r, 700));
  }
  if (S.al.st.state === 'done') toast(`Alarm query finished: ${fmt(S.al.alarms.length)} alarms`);
}
function alStatusHtml() {
  const st = S.al.st; if (!st) return '';
  if (st.state === 'error') return `<div class="fx-box crit"><b>Alarm query failed.</b> ${esc(st.message)}${st.execution ? ` <span class="small muted">Execution <span class="mono">${esc(st.execution)}</span></span>` : ''}${st.rundeck_status ? ` <span class="small muted">· status ${esc(st.rundeck_status)}</span>` : ''} <button type="button" class="btn ghost sm" data-al="dismiss">Dismiss</button></div>`;
  if (st.state === 'cancelled') return `<div class="fx-box"><b>Stopped.</b> ${esc(st.message || '')} ${fmt(st.count || 0)} alarms had been received.</div>`;
  if (st.state === 'done') return `<div class="fx-box ok"><b>Done.</b> ${esc(st.message)}${st.execution ? ` <span class="small muted">Execution <span class="mono">${esc(st.execution)}</span></span>` : ''}${st.rundeck_status ? ` <span class="small muted">· status ${esc(st.rundeck_status)}</span>` : ''}${st.status_checks ? ` <span class="small muted">· ${fmt(st.status_checks)} status ${st.status_checks === 1 ? 'check' : 'checks'}</span>` : ''}${st.parse_errors ? ` <span class="small muted">· ${fmt(st.parse_errors)} non-alarm output entries ignored</span>` : ''}</div>`;
  return `<div class="stack" style="gap:8px"><div class="row spread"><b>${esc(st.message || 'Working…')}</b><button type="button" class="btn sm" data-al="stop">Stop</button></div>
    <div class="progress busy"><i style="width:30%"></i></div><div class="row small muted" style="gap:4px 18px"><span><b>${fmt(st.count || 0)}</b> alarms received</span><span>${fmt(st.entries || 0)} output entries read</span>${st.execution ? `<span>execution <span class="mono">${esc(st.execution)}</span></span>` : ''}${st.rundeck_status ? `<span>Rundeck status <b>${esc(st.rundeck_status)}</b></span>` : ''}${st.status_checks ? `<span>${fmt(st.status_checks)} status ${st.status_checks === 1 ? 'check' : 'checks'}</span>` : ''}</div></div>`;
}
function alRows() {
  const q = S.al.search.trim().toLowerCase(), show = S.al.show;
  let rows = S.al.alarms.map(a => ({a, s: alSiteFor(a), sev: alSeverity(a)}));
  if (show) rows = rows.filter(x => x.sev === show);
  if (q) rows = rows.filter(x => [x.a.node, x.a.alarmId, x.a.observationTime, x.a.alarmDetail, x.a.faultId, x.a.alarmingObjectIds, x.a.alarmName, x.a.severity, x.a.faultDescription, x.s && x.s.id, x.s && x.s.name].join(' ').toLowerCase().includes(q));
  rows.sort((a, b) => (AL_SEV_RANK[a.sev] ?? 50) - (AL_SEV_RANK[b.sev] ?? 50) || cmp(b.a.observationTime, a.a.observationTime) || cmp(a.a.alarmName, b.a.alarmName));
  return rows;
}

      <div class="row"><input type="search" id="al-q" placeholder="Filter alarms, sites or objects" value="${esc(S.al.search)}" style="width:280px"><button class="btn sm" data-al="csv">Export CSV</button></div></div>

    <div class="tw tall" data-ks="altable"><table class="t"><thead><tr><th>Severity</th><th>Site</th><th>Rundeck node</th><th>Observed</th><th>Alarm</th><th>Fault ID</th><th>Alarm ID</th><th>Alarming object</th><th>Detail</th><th>Description</th></tr></thead><tbody>

  if (/(?:^|[#;])UP(?:$|[#;])/i.test(a) || /#UP\b/i.test(a)) return 'U-plane';
  const src = (source.ip || []).find(x => x[0] === localIp);

function ipsecData() {

      ikeDn:r[4], ikeLabel:r[5], ikeTunnel:r[6], ikeState:r[7], ikeMode:r[8],

function relData(){
  const key = vkey(); if (memo.rel && memo.rel.key === key) return memo.rel;
  const sites = V(); let lte = 0, nr = 0, endc = 0, endcSites = 0, lteNoEndc = 0, diagN = 0, diagMsg = '';
  const enbFan = new Map(), gnbFan = new Map(), rows = [];
  for (const s of sites){
    const r = s.rel || {lte: 0, nr: 0, endc: 0};
    if (s.relErr || s.secErr){ diagN++; if (!diagMsg) diagMsg = s.relErr || s.secErr; }
    lte += r.lte || 0; nr += r.nr || 0; endc += r.endc || 0;
    if ((r.endc || 0) > 0) endcSites++; else if ((r.cellsLte || 0) > 0 || (r.lte || 0) > 0) lteNoEndc++;
    (r.enbSet || []).forEach(e => enbFan.set(e, (enbFan.get(e) || 0) + 1));
    (r.gnbSet || []).forEach(gg => gnbFan.set(gg, (gnbFan.get(gg) || 0) + 1));
    rows.push(Object.assign({s}, r));
  }
  const topEnb = [...enbFan.entries()].sort((a, b) => b[1] - a[1] || cmp(a[0], b[0]));
  const topGnb = [...gnbFan.entries()].sort((a, b) => b[1] - a[1] || cmp(a[0], b[0]));
  memo.rel = {key, rows, lte, nr, endc, endcSites, lteNoEndc, enbCount: enbFan.size, gnbCount: gnbFan.size, topEnb, topGnb, diagN, diagMsg};
  return memo.rel;
}
function relRows(D){

  if (q) rows = rows.filter(r => ((r.s.id || '') + ' ' + (r.s.name || '')).toLowerCase().includes(q));
  const k = S.relSort.k, dir = S.relSort.dir;
  const val = r => k === 'id' ? (r.s.name || r.s.id || '') : (r[k] || 0);
  rows.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'number' ? x - y : cmp(String(x), String(y))) * dir || cmp(a.s.id, b.s.id); });
  return rows;
}

function ipsecTopo(){
  const key = vkey(); if (memo.segw && memo.segw.key === key) return memo.segw;
  const sites = V(), gw = new Map(); let siteNo = 0;
  for (const s of sites){
    let any = false;
    for (const g of (s.segw || [])){ if ((g[1] || '').toUpperCase().indexOf('X2') >= 0) continue; const addr = g[0]; any = true; let e = gw.get(addr); if (!e){ e = {addr, sites: new Set(), peers: 0, est: 0, labels: new Set()}; gw.set(addr, e); } e.peers++; e.sites.add(s.uid); if (g[2] === 'ESTABLISHED') e.est++; if (g[1]) e.labels.add(g[1]); }
    if (any) siteNo++;
  }
  const rows = [...gw.values()].map(e => ({addr: e.addr, sites: e.sites.size, uids: [...e.sites], peers: e.peers, est: e.est, labels: [...e.labels]})).sort((a, b) => b.sites - a.sites || b.peers - a.peers || cmp(a.addr, b.addr));
  memo.segw = {key, rows, shared: rows.filter(r => r.sites > 1).length, gateways: rows.length, siteNo};
  return memo.segw;
}

function rtStats() {

async function rtStart() {

  if (nodes.length !== 1) { S.rt.st={state:'error',message:'BTS RealTime measurement runs one BTS at a time. Keep exactly one node in the BTS filter.'}; rtUpdate(); return; }
  if (!S.rt.token.trim()) { S.rt.st={state:'error',message:'Enter your Rundeck API token. The token is not saved.'}; rtUpdate(); return; }

}
async function rtPoll(id) {

    let st;

    catch(e) { if(S.rt.run) S.rt.run.active=false; S.rt.st={state:'error',message:'Lost contact with the helper ('+e.message+'). Is its window still open?'}; rtUpdate(); return; }

  if(pre) pre.addEventListener('input',debounce(()=>{S.rt.form.prefixes=pre.value;rtSave();rerender();},220));
  const region=$('#rt-region'); if(region) region.addEventListener('change',e=>{S.rt.form.region=e.target.value;rtSave();rerender();});
  const uf=$('#rt-usefilter'); if(uf) uf.addEventListener('change',()=>{S.rt.form.useFilter=uf.checked;rtSave();rerender();});
  const filter=$('#rt-filter'); if(filter) filter.addEventListener('input',()=>{S.rt.filterText=filter.value;});
  const form=$('#rt-form');
  if(!form) return;
  const wait=$('#rt-wait'); if(wait) wait.addEventListener('change',rtCapture);
  const token=$('#rt-token'); if(token) token.addEventListener('input',e=>{S.rt.token=e.target.value;});
  form.addEventListener('submit',e=>{e.preventDefault();rtCapture();rtStart();});
}
function rtUpdate(){
  const st=$('#rt-status'); if(st) st.innerHTML=rtStatusHtml();
  const go=$('#rt-go'); if(go) go.disabled=rtBusy();
  const res=$('#rt-results'); if(res) res.outerHTML=rtResultsHtml();
  const pill=$('#loadpill');
  if(pill && !(S.load&&S.load.running) && !(S.fx.st&&FX_ACTIVE.includes(S.fx.st.state)) && !pgBusy() && !alBusy() && !trBusy()){
    if(rtBusy()){ const x=S.rt.st; pill.hidden=false; pill.innerHTML=`<a href="#realtime" style="color:inherit;text-decoration:none">RealTime · ${esc(x.rundeck_status||x.state||'running')}</a><span class="mini"><i style="width:35%"></i></span>`; }
    else pill.hidden=true;
  }
}
function rtCsv(){
  const R=S.rt.result; if(!R) return;
  const rows=[['category','path','value','voltage_V','power_W','site_id','rundeck_filter','request_id','request_status','measurement_time','rundeck_execution']];
  (R.measurements||[]).forEach(x=>{ const obj=x.value&&typeof x.value==='object'?x.value:null; rows.push([x.category||'',x.path||'',obj?'':(x.value??''),obj?(obj.voltage??''):'',obj?(obj.power??''):'',rtSiteLabel(),S.rt.run&&S.rt.run.filter||'',R.requestId??'',R.requestStatus||'',R.time||'',S.rt.st&&S.rt.st.execution||'']); });
  download('bts_realtime_'+String(rtSiteLabel()||'site').replace(/[^A-Za-z0-9_.-]+/g,'_')+'_'+rtTime(S.rt.run&&S.rt.run.started||Date.now()).replace(/[: ]/g,'-')+'.csv',toCsv(rows),'text/csv');
}
document.addEventListener('click',e=>{ const el=e.target.closest('[data-rt]'); if(!el)return; const a=el.dataset.rt; if(a==='more'){rtCapture();S.rt.more=!S.rt.more;rerender();} else if(a==='reset-filter'){const pick=rtSelection(),T=rtTargets(pick,pick.sel);S.rt.filterSig=T.nodes.join('\n');S.rt.filterText=alAutoFilter(T.nodes);rerender();} else if(a==='stop'){if(HELPER)H.post('realtimecancel',{}).catch(()=>{});el.disabled=true;el.textContent='Stopping…';} else if(a==='dismiss'){S.rt.st=null;rtUpdate();} else if(a==='csv')rtCsv(); });


/* ---------------- live cell status (NetAct database, through the helper) ----------------
   The helper runs two fixed read-only queries (LTE: C_LTE_LNCEL, NR: C_NR_NR_CLL) and returns
   [tech, DN, name, admin state, operational state] for every cell. Cells are matched to loaded sites by the
   MRBTS-<id> in their DN. The database password is only kept in this page's memory. */
const CS_KEY = 'mrbts-cellstatus-v1';
S.cs = {form: Object.assign({host: (HELPER && HELPER.celldb && HELPER.celldb.host) || 'osdbrpf-scan.ipsn.internal.vf.net.nz', port: String((HELPER && HELPER.celldb && HELPER.celldb.port) || 1521),
    service: (HELPER && HELPER.celldb && HELPER.celldb.service) || 'WNIP', lte: true, nr: true}, (() => { try { return JSON.parse(lsGet(CS_KEY) || '{}'); } catch (e) { return {}; } })()),
  user: '', password: '', busy: false, err: '', res: null, bySite: new Map(), open: false};
const csSave = () => { const f = S.cs.form; lsSet(CS_KEY, JSON.stringify({host: f.host, port: f.port, service: f.service, lte: f.lte, nr: f.nr})); };   // no username, no password
// a cell: ok = enabled; locked = locked or shutting down on purpose; down = unlocked (or unknown) but not enabled
const csCellState = (adm, op) => /^enabled$/i.test(op) ? 'ok' : /locked|shutting/i.test(adm) && !/^unlocked$/i.test(adm) ? 'locked' : 'down';
function csApply(res) {
  const byId = new Map();
  S.sites.forEach(s => { if (!byId.has(String(s.id))) byId.set(String(s.id), []); byId.get(String(s.id)).push(s); });
  const bySite = new Map(); let matched = 0;
  for (const [tech, dn, name, adm, op] of res.rows) {
    const sp = splitDn(dn); if (!sp) continue;
    const list = byId.get(String(sp.site)); if (!list) continue;
    matched++;
    const st = csCellState(adm, op), seg = lastSeg(dn);
    for (const s of list) {
      let a = bySite.get(s.uid);
      if (!a) bySite.set(s.uid, a = {lte: {n: 0, ok: 0, locked: 0, down: 0}, nr: {n: 0, ok: 0, locked: 0, down: 0}, cells: []});
      const c = a[tech] || a.lte; c.n++; c[st]++;
      a.cells.push([tech, seg, name, adm, op, st, dn]);
    }
  }
  S.cs.res = res; S.cs.bySite = bySite; S.cs.matched = matched; S.cs.total = res.rows.length;
}
function csSiteState(s) {
  const a = S.cs.bySite.get(s.uid);
  if (!a) return 'none';
  const n = a.lte.n + a.nr.n, down = a.lte.down + a.nr.down, locked = a.lte.locked + a.nr.locked;
  if (!n) return 'none';
  return down === n ? 'alldown' : down ? 'somedown' : locked ? 'locked' : 'ok';
}
const CS_LABEL = {ok: 'All cells enabled', locked: 'Some cells locked', somedown: 'Some cells down', alldown: 'All cells down', none: 'No live data'};
MAP_MODES.cells = {label: 'Cell status', hideZero: true, rScale: 1.3, stackWorst: true,
  cats: [['All cells enabled', '--ping-ok'], ['Some cells locked', '--s1'], ['Some cells down', '--ping-loss'], ['All cells down', '--ping-down'], ['No live data', '--c-other']],
  drawOrder: ['No live data', 'All cells enabled', 'Some cells locked', 'Some cells down', 'All cells down'], of: s => CS_LABEL[csSiteState(s)]};
function csInfoRows(s) {   // rows for the map's site card
  if (!S.cs.res) return '';
  const a = S.cs.bySite.get(s.uid);
  if (!a) return `<span>Live cells</span><span class="muted">not in the NetAct result</span>`;
  const part = (k, c) => c.n ? `${k} ${c.ok}/${c.n} enabled${c.locked ? ` · ${c.locked} locked` : ''}${c.down ? ` · <b style="color:var(--crit)">${c.down} down</b>` : ''}` : '';
  const bad = a.cells.filter(c => c[5] !== 'ok').slice(0, 8);
  return `<span>Live cells</span><span>${[part('LTE', a.lte), part('NR', a.nr)].filter(Boolean).join('<br>')}
    ${bad.length ? `<ul class="cs-cells">${bad.map(c => `<li>${esc(c[1])}${c[2] ? ' · ' + esc(c[2]) : ''}: ${esc(c[3] || '?')} / ${esc(c[4] || '?')}</li>`).join('')}${a.cells.filter(c => c[5] !== 'ok').length > 8 ? '<li>…</li>' : ''}</ul>` : ''}
    <span class="small muted">NetAct ${esc(S.cs.res.time)}</span></span>`;
}
function cellStatusHtml() {
  const f = S.cs.form, R = S.cs.res;
  const can = HELPER && HELPER.cellstatus;
  let sum = '';
  if (R) {
    const c = {ok: 0, locked: 0, somedown: 0, alldown: 0};
    V().forEach(s => { const k = csSiteState(s); if (k in c) c[k]++; });
    const cellsDown = [...S.cs.bySite.values()].reduce((x, a) => x + a.lte.down + a.nr.down, 0);
    sum = `<div class="cs-sum" style="margin-top:8px"><span><b>${fmt(S.cs.total)}</b> cells from NetAct (${Object.entries(R.counts).map(([k, n]) => k.toUpperCase() + ' ' + fmt(n)).join(', ')}) at ${esc(R.time)}, ${R.took}s</span>
      <span>${fmt(S.cs.matched)} belong to loaded sites</span><span><b style="color:var(--crit)">${fmt(cellsDown)}</b> cells down</span>
      <span>Sites: ${fmt(c.ok)} all enabled · ${fmt(c.locked)} some locked · ${fmt(c.somedown)} some down · ${fmt(c.alldown)} all down</span></div>`;
  }
  return `<details class="mapset" id="cs-panel"${S.cs.open || S.cs.busy || S.cs.err ? ' open' : ''}><summary class="small">Live cell status (NetAct)${R ? `: <b>updated ${esc(R.time)}</b>` : ''}</summary>
    ${can ? `<div class="row" style="margin-top:8px;gap:8px 10px;align-items:flex-end">
      <label class="fld" style="min-width:230px;flex:2"><span class="eyebrow">Database host</span><input type="text" id="cs-host" value="${esc(f.host)}" spellcheck="false"></label>
      <label class="fld" style="width:80px"><span class="eyebrow">Port</span><input type="text" id="cs-port" value="${esc(f.port)}" inputmode="numeric"></label>
      <label class="fld" style="width:110px"><span class="eyebrow">Service</span><input type="text" id="cs-service" value="${esc(f.service)}" spellcheck="false"></label>
      <label class="fld" style="width:150px"><span class="eyebrow">Username</span><input type="text" id="cs-user" value="${esc(S.cs.user)}" autocomplete="username" spellcheck="false"></label>
      <label class="fld" style="width:170px"><span class="eyebrow">Password</span><input type="password" id="cs-pass" value="${esc(S.cs.password)}" autocomplete="current-password"></label>
      <label class="check"><input type="checkbox" id="cs-lte"${f.lte ? ' checked' : ''}>LTE</label><label class="check"><input type="checkbox" id="cs-nr"${f.nr ? ' checked' : ''}>NR</label>
      <button class="btn sm primary" data-cs="run"${S.cs.busy ? ' disabled' : ''}>${S.cs.busy ? 'Querying NetAct…' : 'Update cell status'}</button>
      ${R ? '<button class="btn sm" data-cs="csv">Export CSV</button>' : ''}</div>
      ${S.cs.err ? `<div class="fx-box crit" style="margin-top:8px"><b>Cell status failed.</b> ${esc(S.cs.err)}</div>` : ''}
      ${S.cs.busy ? '<div class="small muted" style="margin-top:8px">Reading every LTE and NR cell from NetAct; this can take a minute.</div>' : ''}${sum}
      <div class="small muted" style="margin-top:6px">The helper runs two fixed read-only queries on C_LTE_LNCEL and C_NR_NR_CLL. The username and password are kept only in this page's memory. Colour the map by <b>Cell status</b> to see the result.</div>`
    : `<div class="small" style="margin-top:8px">Live cell status needs the helper version 1.12 or later (it connects to the NetAct database for the app)${HELPER ? '; the running helper is ' + esc(HELPER.version) : ''}.</div>`}
  </details>`;
}
function cellStatusBind() {
  const d = $('#cs-panel'); if (!d) return;
  d.addEventListener('toggle', () => { S.cs.open = d.open; });
  const bind = (id, fn) => { const el = $('#' + id); if (el) el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', () => fn(el)); };
  bind('cs-host', el => { S.cs.form.host = el.value; csSave(); }); bind('cs-port', el => { S.cs.form.port = el.value; csSave(); });
  bind('cs-service', el => { S.cs.form.service = el.value; csSave(); });
  bind('cs-user', el => { S.cs.user = el.value; }); bind('cs-pass', el => { S.cs.password = el.value; });
  bind('cs-lte', el => { S.cs.form.lte = el.checked; csSave(); }); bind('cs-nr', el => { S.cs.form.nr = el.checked; csSave(); });
  const pw = $('#cs-pass'); if (pw) pw.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); csRun(); } });
}
async function csRun() {
  if (S.cs.busy || !HELPER) return;
  const f = S.cs.form, tech = [f.lte && 'lte', f.nr && 'nr'].filter(Boolean);
  if (!S.cs.user.trim() || !S.cs.password) { S.cs.err = 'Fill in the database username and password.'; rerender(); return; }
  if (!tech.length) { S.cs.err = 'Tick LTE and/or NR.'; rerender(); return; }
  S.cs.busy = true; S.cs.err = ''; S.cs.open = true; rerender();
  try {
    const res = await H.post('cellstatus', {host: f.host.trim(), port: +f.port || 1521, service: f.service.trim(), user: S.cs.user.trim(), password: S.cs.password, tech});
    csApply(res);
    MAPS.color = 'cells'; saveMapPrefs();
    toast(`Cell status updated: ${fmt(S.cs.total)} cells, ${fmt(S.cs.matched)} on loaded sites`);
  } catch (e) { S.cs.err = e.message; }
  S.cs.busy = false;
  if (currentView() === 'map') rerender();
}
function csCsv() {
  if (!S.cs.res) return;
  const rows = [['mrbts_id', 'site_name', 'region', 'tech', 'cell', 'cell_name', 'admin_state', 'operational_state', 'status', 'dn', 'netact_time']];
  const st = {ok: 'enabled', locked: 'locked', down: 'down'};
  V().forEach(s => { const a = S.cs.bySite.get(s.uid); if (a) a.cells.forEach(c => rows.push([s.id, s.name, s.region, c[0].toUpperCase(), c[1], c[2], c[3], c[4], st[c[5]], c[6], S.cs.res.time])); });
  download('cell_status_' + S.cs.res.time.replace(/[: ]/g, '-') + '.csv', toCsv(rows), 'text/csv');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-cs]'); if (!el) return;
  if (el.dataset.cs === 'run') csRun(); else if (el.dataset.cs === 'csv') csCsv();
});

</script>
